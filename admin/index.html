<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Administração - Catálogo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 420px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.1);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    h2 {
      margin-top: 30px;
      font-size: 20px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      padding: 12px;
      font-size: 16px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:hover {
      opacity: .9;
    }

    .secondary {
      background: #777;
    }

    .hidden {
      display: none;
    }

    #mensagem {
      margin-top: 20px;
      text-align: center;
      min-height: 20px;
    }

    .erro {
      color: #c00;
    }

    .sucesso {
      color: #087f23;
    }

    .separador {
      text-align: center;
      margin: 25px 0;
      color: #777;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Administração</h1>

  <!-- LOGIN -->

  <div id="loginArea">

    <h2>Entrar</h2>

    <form id="loginForm">

      <input
        type="email"
        id="loginEmail"
        placeholder="E-mail"
        required
      >

      <input
        type="password"
        id="loginPassword"
        placeholder="Senha"
        required
      >

      <button type="submit">
        Entrar
      </button>

    </form>

    <div class="separador">
      ou
    </div>

    <!-- CADASTRO -->

    <h2>Criar conta</h2>

    <form id="signupForm">

      <input
        type="text"
        id="signupName"
        placeholder="Nome"
        required
      >

      <input
        type="email"
        id="signupEmail"
        placeholder="E-mail"
        required
      >

      <input
        type="password"
        id="signupPassword"
        placeholder="Senha"
        minlength="8"
        required
      >

      <input
        type="password"
        id="signupPassword2"
        placeholder="Confirmar senha"
        minlength="8"
        required
      >

      <button type="submit">
        Criar conta
      </button>

    </form>

  </div>


  <!-- ÁREA LOGADA -->

  <div id="loggedArea" class="hidden">

    <h2>Usuário autenticado</h2>

    <p id="usuario"></p>

    <button
      id="logoutButton"
      class="secondary"
    >
      Sair
    </button>

  </div>


  <div id="mensagem"></div>

</div>


<script type="module">

  import {
    createAuthClient
  } from "https://esm.sh/@neondatabase/auth";


  // =====================================================
  // NEON AUTH
  // =====================================================

  const AUTH_URL =
    "https://ep-frosty-pond-acb79o3h.neonauth.sa-east-1.aws.neon.tech/neondb/auth";


  const auth =
    createAuthClient(AUTH_URL);


  // =====================================================
  // ELEMENTOS
  // =====================================================

  const loginArea =
    document.getElementById("loginArea");

  const loggedArea =
    document.getElementById("loggedArea");

  const usuario =
    document.getElementById("usuario");

  const mensagem =
    document.getElementById("mensagem");


  // =====================================================
  // MENSAGEM
  // =====================================================

  function mostrarMensagem(texto, erro = false) {

    mensagem.textContent = texto;

    mensagem.className =
      erro ? "erro" : "sucesso";
  }


  // =====================================================
  // VERIFICAR SESSÃO
  // =====================================================

  async function verificarSessao() {

    try {

      const resultado =
        await auth.getSession();

      const session =
        resultado?.data?.session;

      const user =
        resultado?.data?.user;


      if (session && user) {

        loginArea.classList.add("hidden");

        loggedArea.classList.remove("hidden");

        usuario.textContent =
          "Olá, " +
          (user.name || user.email);

      }

    } catch (erro) {

      console.error(erro);

    }

  }


  // =====================================================
  // LOGIN
  // =====================================================

  document
    .getElementById("loginForm")
    .addEventListener("submit", async event => {

      event.preventDefault();

      mostrarMensagem("Entrando...");

      const email =
        document.getElementById("loginEmail").value;

      const password =
        document.getElementById("loginPassword").value;


      try {

        const resultado =
          await auth.signIn.email({
            email,
            password
          });


        if (resultado.error) {

          throw new Error(
            resultado.error.message ||
            "Erro ao entrar"
          );

        }


        mostrarMensagem(
          "Login realizado com sucesso."
        );

        await verificarSessao();


      } catch (erro) {

        console.error(erro);

        mostrarMensagem(
          erro.message ||
          "Não foi possível entrar.",
          true
        );

      }

    });


  // =====================================================
  // CADASTRO
  // =====================================================

  document
    .getElementById("signupForm")
    .addEventListener("submit", async event => {

      event.preventDefault();

      const name =
        document.getElementById("signupName").value.trim();

      const email =
        document.getElementById("signupEmail").value.trim();

      const password =
        document.getElementById("signupPassword").value;

      const password2 =
        document.getElementById("signupPassword2").value;


      if (password !== password2) {

        mostrarMensagem(
          "As senhas não são iguais.",
          true
        );

        return;
      }


      mostrarMensagem("Criando conta...");


      try {

        const resultado =
          await auth.signUp.email({
            name,
            email,
            password
          });


        if (resultado.error) {

          throw new Error(
            resultado.error.message ||
            "Erro ao criar conta"
          );

        }


        mostrarMensagem(
          "Conta criada com sucesso."
        );

        await verificarSessao();


      } catch (erro) {

        console.error(erro);

        mostrarMensagem(
          erro.message ||
          "Não foi possível criar a conta.",
          true
        );

      }

    });


  // =====================================================
  // LOGOUT
  // =====================================================

  document
    .getElementById("logoutButton")
    .addEventListener("click", async () => {

      await auth.signOut();

      loggedArea.classList.add("hidden");

      loginArea.classList.remove("hidden");

      mostrarMensagem(
        "Você saiu da conta."
      );

    });


  // =====================================================
  // INICIAR
  // =====================================================

  verificarSessao();

</script>

</body>
</html>
