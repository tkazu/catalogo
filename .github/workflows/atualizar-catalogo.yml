name: Atualizar catálogo

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install pg

      - name: Gerar produtos.json
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          node <<'EOF'
          const { Client } = require("pg");
          const fs = require("fs");

          async function main() {
            const client = new Client({
              connectionString: process.env.NEON_DATABASE_URL,
              ssl: {
                rejectUnauthorized: false
              }
            });

            await client.connect();

            const result = await client.query(`
             SELECT
              id,
              nome,
              categoria,
              descricao,
              preco,
              validade,
              imagem
            FROM produtos
              WHERE ativo = true
              ORDER BY id
            `);

            const produtos = result.rows.map(p => ({
              id: p.id,
              name: p.nome,
              category: "",
              description: p.descricao || "",
              price: Number(p.preco),
              validade: p.validade
                ? p.validade.toISOString().substring(0, 10)
                : null,
              image: p.imagem || ""
            }));

            fs.writeFileSync(
              "produtos.json",
              JSON.stringify(produtos, null, 2) + "\n"
            );

            await client.end();

            console.log(`${produtos.length} produtos gerados.`);
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

      - name: Atualizar GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add produtos.json
          git diff --cached --quiet || git commit -m "Atualizar catálogo"
          git push
